[package]
name = "jadb"
version = "0.1.21"
description = "Cross-platform APK analysis desktop GUI"
authors = ["JADB Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "jadb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
scopeguard = "1"
glob = "0.3"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
walkdir = "2"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
