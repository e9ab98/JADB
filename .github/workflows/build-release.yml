name: Build & Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

# Re-pushing the same tag cancels the previous in-flight run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: darwin-arm64
            zealot_channel: "<jadb_mac_arm64_channel_key>"   # 替换成 Zealot 上对应 channel 的 32-char key
            bundler_args: "--bundles dmg,app"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: darwin-x64
            zealot_channel: "<jadb_mac_x64_channel_key>"   # 替换成 Zealot 上对应 channel 的 32-char key
            bundler_args: "--bundles dmg,app"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
            zealot_channel: "<jadb_win_x64_channel_key>"   # 替换成 Zealot 上对应 channel 的 32-char key
            bundler_args: "--bundles msi"
          # Windows ARM64 (Surface Pro X, Snapdragon X laptops). GitHub
          # added windows-11-arm as a GA label in 2024.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
            zealot_channel: "<jadb_win_arm64_channel_key>"   # 替换成 Zealot 上对应 channel 的 32-char key
            bundler_args: "--bundles msi"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: changelog
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          previous_tag=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          changelog_section=""
          if [ -f CHANGELOG.md ]; then
            version="${CURRENT_TAG#v}"
            changelog_section=$(awk -v version="$version" '
              $0 ~ "^## [[]" { in_section = 0 }
              $0 ~ "^## [[]" version "[]]" { in_section = 1; next }
              /^## [[]/ && in_section { in_section = 0 }
              in_section
            ' CHANGELOG.md)
          fi

          {
            if [ -n "$changelog_section" ]; then
              printf '%s\n\n' "$changelog_section"
            fi

            printf '### Commits\n\n'
            if [ -n "$previous_tag" ]; then
              git log -n 100 "${previous_tag}..${CURRENT_TAG}" \
                --pretty=format:'- [`%h`]('$GITHUB_SERVER_URL'/'$GITHUB_REPOSITORY'/commit/%H) %s'
              printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous_tag" "$CURRENT_TAG"
            else
              git log -n 100 "$CURRENT_TAG" \
                --pretty=format:'- [`%h`]('$GITHUB_SERVER_URL'/'$GITHUB_REPOSITORY'/commit/%H) %s'
              printf '\n\n_First tagged release of this line._\n'
            fi
          } > release-notes.md

          delimiter="RELEASE_NOTES_$(git rev-parse --short HEAD)"
          {
            printf 'body<<%s\n' "$delimiter"
            cat release-notes.md
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Check version drift
        run: scripts/check-version-drift.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      # Pinned to 1.91.1 — see rust-toolchain.toml for the full reasoning.
      # Bump here AND in rust-toolchain.toml together; clippy's default
      # lint set evolves with each stable release, so a stale pin will
      # eventually start catching new lints on green code.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # When the same tag is re-pushed (or a previous run was cancelled
      # mid-flight), the release + its `latest.json` may already exist on
      # GitHub. tauri-action's upload step then calls
      # `GET /repos/{owner}/{repo}/releases/assets/{id}` to look up the
      # previously uploaded asset, but the cached `latest.json` can
      # reference an asset ID that was replaced/removed by a concurrent
      # matrix job, producing `Error: Not Found - GET .../releases/assets/...`
      # and aborting the publish. We delete the existing release (idempotent
      # across matrix jobs) so every workflow run starts from a clean slate.
      # Only one matrix job needs to actually delete; `|| true` swallows
      # the 404 from the other jobs racing to delete the same release.
      - name: Delete pre-existing release for ${{ github.ref_name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Deleting pre-existing release ${{ github.ref_name }}..."
            gh release delete "${{ github.ref_name }}" --cleanup-tags --yes || true
          else
            echo "No pre-existing release for ${{ github.ref_name }}."
          fi

      # tauri-action triggers `pnpm tauri build` (which runs `beforeBuildCommand`
      # = `pnpm build` per tauri.conf.json), signs every bundle with
      # TAURI_SIGNING_PRIVATE_KEY, and uploads dmg/msi + .sig + the
      # generated `latest.json` to the GitHub release for ${{ github.ref_name }}.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "JADB ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.bundler_args }}

      # Mirror the bundles to Zealot (https://e9ab98.jzy.cc) so the Tauri
      # updater relay can serve latest.json. Unlike NiceSSH, this step
      # uploads BOTH the .dmg (for human download) AND the .app.tar.gz
      # (what Tauri's macOS updater actually downloads). Without the
      # .app.tar.gz upload, Mac users would see "no update available"
      # or the auto-update would fail with a 404 on the bundle URL.
      #
      # Each .sig file (from tauri-action's signing step) is embedded
      # into Zealot's custom_fields jsonb under `tauri_signature`; the
      # relay reads it back and assembles the Tauri manifest signature
      # field. The relay also stores the bundle filename under
      # `tauri_filename` for future debugging.
      #
      # Requires the Zealot channel to have bundle_id set to "*" (or empty)
      # so the bundle_id_matched validation passes for unparsed .dmg/.msi
      # files. AppInfo (Zealot's parser) cannot read Tauri bundles, so each
      # upload will have empty metadata on the Zealot side.
      - name: Upload to Zealot
        if: success() && matrix.zealot_channel != ''
        shell: bash
        env:
          ZEALOT_HOST: ${{ secrets.ZEALOT_HOST }}
          ZEALOT_TOKEN: ${{ secrets.ZEALOT_TOKEN }}
        run: |
          set -u

          if [ -z "$ZEALOT_HOST" ] || [ -z "$ZEALOT_TOKEN" ]; then
            echo "::warning::ZEALOT_HOST / ZEALOT_TOKEN not set, skipping Zealot upload"
            exit 0
          fi

          # Pick which bundle files to upload per target. We use an array
          # rather than a single `ext` because macOS produces TWO installable
          # artifacts: the .dmg (GUI installer) and the .app.tar.gz (what
          # Tauri's updater downloads). Windows produces one .msi.
          shopt -s nullglob
          files=()
          case "${{ matrix.target }}" in
            *-apple-darwin)
              files=(
                src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.dmg
                src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
              )
              ;;
            *-windows-msvc)
              files=(
                src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
              )
              ;;
            *)
              echo "::warning::No Zealot upload rule for target ${{ matrix.target }}"
              exit 0
              ;;
          esac

          # Read the changelog body from release-notes.md (written by the
          # Generate release notes step). Reading via cat (not via
          # ${{ steps.x.outputs.body }} substitution) avoids bash parsing
          # the multi-line content: even inside double quotes, bash still
          # treats backticks as command substitution, which breaks because
          # the changelog contains markdown like `[`8577df8`](url)` whose
          # backticks would try to execute "8577df8" as a command.
          CHLOG_FILE=$(mktemp)
          trap 'rm -f "$CHLOG_FILE"' EXIT
          cat "$GITHUB_WORKSPACE/release-notes.md" > "$CHLOG_FILE"

          uploaded=0
          failed=0
          for f in "${files[@]}"; do
            echo "Uploading $f -> channel ${{ matrix.zealot_channel }}"

            sig_file="${f}.sig"

            # Build curl args as a single non-empty array. Always has at
            # least file + channel_key, so we never hit bash 3.2's
            # `set -u` + empty-array footgun.
            CURL_ARGS=(
              -fsSL -X POST "$ZEALOT_HOST/api/apps/upload?token=$ZEALOT_TOKEN"
              -F "file=@${f}"
              -F "channel_key=${{ matrix.zealot_channel }}"
            )

            if [ -f "$sig_file" ]; then
              sig_json=$(SIGNATURE_PATH="$sig_file" BUNDLE_PATH="$f" python3 -c "import json, os, sys; sig=open(os.environ['SIGNATURE_PATH']).read(); print(json.dumps({'tauri_signature': sig, 'tauri_filename': os.path.basename(os.environ['BUNDLE_PATH'])}))")
              CURL_ARGS+=(-F "custom_fields=${sig_json}")
              echo "  + embedded signature ($(wc -c < "$sig_file") bytes) for $(basename "$f")"
            else
              echo "::warning::No .sig file at $sig_file; relay will return empty signature"
            fi

            CURL_ARGS+=(
              -F "source=github-actions"
              -F "branch=${{ github.ref_name }}"
              -F "git_commit=${{ github.sha }}"
              -F "ci_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              -F "changelog=<${CHLOG_FILE}"
            )

            if curl "${CURL_ARGS[@]}"; then
              uploaded=$((uploaded + 1))
            else
              failed=$((failed + 1))
              echo "::warning::Zealot upload failed for $f"
            fi
          done

          echo "Upload summary: uploaded=$uploaded, failed=$failed"
          if [ "$uploaded" -eq 0 ] && [ "${#files[@]}" -gt 0 ]; then
            echo "::warning::No bundle files were uploaded (build may have failed to produce artifacts)"
          fi

  post-rename:
    name: Normalize aarch64 \xe2\x86\x92 arm64 in release assets
    needs: build-and-release
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rename aarch64 assets to arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/ci/rename-aarch64-assets.sh
